version: '3.9'

services:
  # Client - Static files served by nginx (production)
  # Note: Client is built into the nginx image, no separate client service needed

  # Backend server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_container
    ports:
      - '5001:5001'
    restart: always
    env_file: 
      - ./.env
    environment:
      - ENVIRONMENT=production
    networks:
      - queue-net
    # Add healthcheck override if needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: nginx_container
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates - make sure these paths exist
      - /etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/fullchain.pem:/etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/fullchain.pem:ro
      - /etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/privkey.pem:/etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/privkey.pem:ro
    restart: always
    networks:
      - queue-net
    depends_on:
      - server

networks:
  queue-net:
    driver: bridge

volumes:
  mongo-data:
  cache: