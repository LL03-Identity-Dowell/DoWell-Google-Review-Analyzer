version: '3.9'

services:
  # Client in development mode
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-dev
    container_name: client_container
    ports:
      - '5173:5173'
    restart: always
    env_file: 
      - ./.env
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - queue-net
    depends_on:
      - server

  # Backend server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_container
    ports:
      - '5001:5001'
    volumes:
      - ./server:/app
    restart: always
    env_file: 
      - ./.env
    environment:
      - ENVIRONMENT=development  # Change to 'production' for prod
    networks:
      - queue-net

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: nginx_container
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (uncomment for production)
      # - /etc/letsencrypt/live/samantaanalysis.uxlivinglab.online/fullchain.pem:/etc/letsencrypt/live/samantaanalysis.uxlivinglab.online/fullchain.pem:ro
      # - /etc/letsencrypt/live/samantaanalysis.uxlivinglab.online/privkey.pem:/etc/letsencrypt/live/samantaanalysis.uxlivinglab.online/privkey.pem:ro
    restart: always
    networks:
      - queue-net
    depends_on:
      - server
      - client

networks:
  queue-net:
    driver: bridge

volumes:
  mongo-data:
  cache: