version: '3.9'

services:
  # Client in development mode
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-build
    container_name: client_container
    ports:
      - '5173:80'
    restart: always
    env_file: 
      - ./.env
    networks:
      - queue-net
    depends_on:
      - server

  # Backend server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server_container
    ports:
      - '5001:5001'
    restart: always
    env_file: 
      - ./.env
    environment:
      - ENVIRONMENT=production  # Change to 'production' for prod
    networks:
      - queue-net

  # Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: nginx_container
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/fullchain.pem:/etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/fullchain.pem:ro
      - /etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/privkey.pem:/etc/letsencrypt/live/googlereviewanalysis.uxlivinglab.org/privkey.pem:ro
    restart: always
    networks:
      - queue-net
    depends_on:
      - server
      - client

networks:
  queue-net:
    driver: bridge

volumes:
  mongo-data:
  cache: